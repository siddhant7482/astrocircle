<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <radialGradient id="starGradient" cx="50%" cy="30%" r="70%">
      <stop offset="0%" style="stop-color:#ffd700;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#ffed4a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f59e0b;stop-opacity:1" />
    </radialGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge> 
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Main star shape -->
  <path d="M50 5 L61 35 L92 35 L69 55 L78 85 L50 70 L22 85 L31 55 L8 35 L39 35 Z" 
        fill="url(#starGradient)" 
        stroke="#d97706" 
        stroke-width="1" 
        filter="url(#glow)"/>
  
  <!-- Inner highlight -->
  <path d="M50 15 L57 35 L75 35 L62 48 L67 68 L50 58 L33 68 L38 48 L25 35 L43 35 Z" 
        fill="#fef3c7" 
        opacity="0.6"/>
</svg> 